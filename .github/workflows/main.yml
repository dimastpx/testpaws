name: Build iOS (unsigned IPA)

on:
  workflow_dispatch:      # ручной запуск кнопкой Run workflow
  push:
    branches: [main]

env:
  GODOT_VERSION: "4.7"    # как в project.godot (config/features)
  GODOT_RELEASE: "stable"
  PROJECT_NAME: "FiveNightsAtPaws"
  BUNDLE_ID: "com.alphapowerful.fivenightsatpaws"   # поменяй на свой
  APP_VERSION: "0.2.0"

jobs:
  build-ios:
    runs-on: macos-15     # если Xcode 26 тут нет, поменяй на macos-26
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true       # на случай mp4/ogv из .gitattributes

      - name: Select newest stable Xcode (need iOS 26 SDK)
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|rc|candidate' | sort -V | tail -1)
          echo "Using: $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          MAJOR=$(xcodebuild -version | awk 'NR==1{print $2}' | cut -d. -f1)
          if [ "$MAJOR" -lt 26 ]; then
            echo "::error::Нужен Xcode 26+ (iOS 26 SDK). Смени runs-on на macos-26."
            exit 1
          fi

      - name: Install Godot and export templates
        run: |
          set -euo pipefail
          TAG="${GODOT_VERSION}-${GODOT_RELEASE}"
          BASE="https://github.com/godotengine/godot/releases/download/${TAG}"
          curl -fsSL -o godot.zip "${BASE}/Godot_v${TAG}_macos.universal.zip"
          curl -fsSL -o templates.tpz "${BASE}/Godot_v${TAG}_export_templates.tpz"
          unzip -q godot.zip
          TEMPLATES_DIR="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          mkdir -p "$TEMPLATES_DIR"
          unzip -q templates.tpz -d templates_tmp
          mv templates_tmp/templates/* "$TEMPLATES_DIR/"
          echo "GODOT=$PWD/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"

      - name: Configure iOS preset
        run: |
          set -euo pipefail
          P=export_presets.cfg
          set_opt() { sed -i '' -E "s|^$1=.*|$1=$2|" "$P"; }
          set_opt 'application/bundle_identifier' "\"${BUNDLE_ID}\""
          set_opt 'application/short_version' "\"${APP_VERSION}\""
          set_opt 'application/version' "\"${APP_VERSION}\""
          set_opt 'application/app_store_team_id' '"ABCDE12345"'   # заглушка, подпись отключена
          set_opt 'application/export_project_only' 'true'         # только Xcode-проект, дальше соберём сами

      - name: Import project (build .godot cache)
        run: |
          "$GODOT" --headless --path . --import || true

      - name: Export Xcode project
        run: |
          set -euo pipefail
          mkdir -p build/ios
          "$GODOT" --headless --path . --export-release "iOS" "$PWD/build/ios/${PROJECT_NAME}.ipa"
          ls -la build/ios

      - name: Build unsigned .app
        run: |
          set -euo pipefail
          XCPROJ=$(find build/ios -maxdepth 2 -name "*.xcodeproj" | head -1)
          echo "Xcode project: $XCPROJ"
          SCHEME=$(xcodebuild -list -project "$XCPROJ" -json | jq -r '.project.schemes[0]')
          echo "Scheme: $SCHEME"
          xcodebuild \
            -project "$XCPROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP=$(find build/derived/Build/Products -maxdepth 2 -name "*.app" | head -1)
          echo "App: $APP"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qr "${PROJECT_NAME}-unsigned.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-ios-unsigned
          path: ${{ env.PROJECT_NAME }}-unsigned.ipa
